version: '3.8'

services:
  image-api:
    build:
      context: .
      dockerfile: docker/Dockerfile  # Specify the Dockerfile inside the 'docker/' directory
    container_name: image-api-container
    ports:
      - "8000:8000"
    networks:
      - app-network

  sonarqube:
    image: sonarqube:latest
    container_name: image-api-sonarqube
    restart: always
    ports:
      - "9000:9000"
    environment:
      SONARQUBE_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONARQUBE_JDBC_USERNAME: sonar
      SONARQUBE_JDBC_PASSWORD: sonar
    depends_on:
      - sonarqube-db
    networks:
      - app-network

  sonarqube-db:
    image: postgres:13
    container_name: sonarqube-db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
