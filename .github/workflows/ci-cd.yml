name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Triggers when pushing to the master branch
  pull_request:
    branches:
      - master  # Runs for pull requests to master

jobs:
  build:
    runs-on: ubuntu-latest  # Uses GitHub-hosted runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/image-api:latest .

      - name: Verify Docker Image exists
        run: docker images

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.actor }}/image-api:latest
