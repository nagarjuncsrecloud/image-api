name: CI/CD Pipeline for Image API (Local)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - "9000:9000"

      sonarqube-db:
        image: postgres:13
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonar

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-mock

      - name: Run Unit Tests
        run: ./run_tests.sh

      - name: Build Docker Image
        run: |
          docker build -t nagarjuncsrecloud/image-api .
          docker tag nagarjuncsrecloud/image-api nagarjuncsrecloud/image-api:latest
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push nagarjuncsrecloud/image-api:latest

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=image-api
            -Dsonar.sources=.
            -Dsonar.host.url=http://18.188.224.206:9000
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Deploy with Terraform
        run: |
          terraform init
          terraform apply -auto-approve || terraform rollback

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Start Minikube (if not running)
        run: |
          minikube status || minikube start --driver=docker

      - name: Set up kubectl
        run: |
          minikube kubectl -- get pods

      - name: Deploy to Local Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/image-api

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get services
