name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Triggers when pushing to the master branch
  pull_request:
    branches:
      - master  # Runs for pull requests to master

jobs:
  build:
    runs-on: ubuntu-latest  # Uses GitHub-hosted runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ghcr.io/${{ github.actor }}/image-api:latest .

      - name: Push Docker Image
        run: docker push ghcr.io/${{ github.actor }}/image-api:latest

      - name: Verify Docker Image Exists
        run: docker images ghcr.io/${{ github.actor }}/image-api:latest
