apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: image-api
spec:
  hosts:
    - "*"
  gateways:
    - image-api-gateway
  http:
    - match:
        - uri:
            prefix: "/api"
      route:
        - destination:
            host: image-api
            port:
              number: 8000
