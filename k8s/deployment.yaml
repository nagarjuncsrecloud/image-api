apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-api
  labels:
    app: image-api
spec:
  replicas: 3  # Adjust based on load
  selector:
    matchLabels:
      app: image-api
  template:
    metadata:
      labels:
        app: image-api
    spec:
      securityContext:  # Apply security context at the pod level
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: image-api
          image: image-api:latest           #nagarjuncsrecloud/image-api:latest  # Ensure this matches your Docker Hub repo
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
            - name: downloaded-images-volume
              mountPath: /app/downloaded_images
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-secrets
          env:
            - name: ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: uploads-volume
          emptyDir: {}  # Creates a temporary writable volume
        - name: downloaded-images-volume
          emptyDir: {}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      containers:
        - name: sonarqube
          image: sonarqube:latest
          ports:
            - containerPort: 9000
          env:
            - name: SONARQUBE_JDBC_URL
              value: jdbc:postgresql://sonarqube-db:5432/sonar
            - name: SONARQUBE_JDBC_USERNAME
              value: sonar
            - name: SONARQUBE_JDBC_PASSWORD
              value: sonar
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube-service
spec:
  selector:
    app: sonarqube
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: image-api-service
spec:
  selector:
    app: image-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP  # Change to ClusterIP if using internal services
